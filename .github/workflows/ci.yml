name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # IMPORTANT: Do NOT make warnings fatal globally.
  # RUSTFLAGS: -D warnings        # ← removed
  # If your crate gates `log` behind the "logging" feature (as your check-cfg hints),
  # enable it for the non-MPI path so `log::…` resolves:
  NON_MPI_FEATURES: "logging"

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps (no MPI)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl clang \
            libopenblas-dev liblapack-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy,rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}

      - name: Build (NO MPI features)
        shell: bash
        # ensure no leftover RUSTFLAGS make warnings fatal
        env:
          RUSTFLAGS: ""
        run: |
          set -euo pipefail
          FEAT_ARGS=()
          if [[ -n "${NON_MPI_FEATURES}" ]]; then
            FEAT_ARGS=(--features "${NON_MPI_FEATURES}")
          fi
          echo "Using feature args: ${FEAT_ARGS[*]:-<none>} (with --no-default-features)"
          cargo build --locked --verbose --no-default-features "${FEAT_ARGS[@]}"

      - name: Lint error path usage
        shell: bash
        run: |
          set -euo pipefail
          if rg -n 'crate::KError\b' src; then
            echo "Use crate::error::KError everywhere (Option A)." >&2
            exit 1
          fi

      - name: Run unit tests (NO MPI)
        shell: bash
        env:
          RUSTFLAGS: ""
        run: |
          set -euo pipefail
          FEAT_ARGS=()
          if [[ -n "${NON_MPI_FEATURES}" ]]; then
            FEAT_ARGS=(--features "${NON_MPI_FEATURES}")
          fi
          cargo test --locked --verbose --no-default-features "${FEAT_ARGS[@]}" -- --nocapture --skip mpi

      - name: Clippy (stable only, NO MPI)
        if: matrix.rust == 'stable'
        shell: bash
        env:
          RUSTFLAGS: ""   # let clippy control severity explicitly below
        run: |
          set -euo pipefail
          FEAT_ARGS=()
          if [[ -n "${NON_MPI_FEATURES}" ]]; then
            FEAT_ARGS=(--features "${NON_MPI_FEATURES}")
          fi
          # Be less strict: show warnings but only fail on correctness/suspicious issues.
          cargo clippy --all-targets --no-default-features "${FEAT_ARGS[@]}" -- \
            -D clippy::correctness -D clippy::suspicious -W warnings

      - name: rustfmt check (stable only)
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Doc tests (stable only, NO MPI)
        if: matrix.rust == 'stable'
        shell: bash
        env:
          RUSTFLAGS: ""
        run: |
          set -euo pipefail
          FEAT_ARGS=()
          if [[ -n "${NON_MPI_FEATURES}" ]]; then
            FEAT_ARGS=(--features "${NON_MPI_FEATURES}")
          fi
          cargo test --doc --locked --no-default-features "${FEAT_ARGS[@]}"

      - name: Build docs (stable only; docs.rs config; NO MPI)
        if: matrix.rust == 'stable'
        env:
          RUSTDOCFLAGS: --cfg docsrs
          RUSTFLAGS: ""
        shell: bash
        run: |
          set -euo pipefail
          FEAT_ARGS=()
          if [[ -n "${NON_MPI_FEATURES}" ]]; then
            FEAT_ARGS=(--features "${NON_MPI_FEATURES}")
          fi
          cargo doc --no-deps --locked --no-default-features "${FEAT_ARGS[@]}"

  mpi-tests:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MPI deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl clang gfortran \
            libclang-dev llvm-dev \
            libopenmpi-dev openmpi-bin openmpi-common \
            libopenblas-dev liblapack-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Verify MPI toolchain (debugging aid)
        run: |
          set -x
          which mpicc || true
          mpicc -show || true
          dpkg -L libopenmpi-dev | grep '\.pc$' || true
          pkg-config --variable pc_path pkg-config || true

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build (MPI features ON)
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/openmpi/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig
          MPICC: mpicc
          MPI_PKG_CONFIG: ompi
        run: |
          cargo build --all-features --locked --verbose || \
          cargo build --locked --verbose --features mpi

      - name: Run MPI tests (4 processes)
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          OMPI_MCA_btl: self,tcp
          OMPI_MCA_plm: rsh
        run: |
          echo "[CI] Running MPI-enabled tests with 4 processes..."
          mpirun --oversubscribe -np 4 \
            cargo test --locked --verbose --features mpi -- --nocapture --ignored
