name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.feature_set.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature_set:
          - name: serial-real
            features: ""
            threads: 1
            mpi: false
          - name: serial-complex
            features: "complex"
            threads: 1
            mpi: false
          - name: serial-rayon1
            features: "rayon"
            threads: 1
            mpi: false
          - name: serial-rayon4
            features: "rayon"
            threads: 4
            mpi: false
          - name: mpi-real
            features: "mpi"
            threads: 1
            mpi: true
          - name: mpi-complex
            features: "mpi complex"
            threads: 1
            mpi: true
          - name: mpi-rayon
            features: "mpi rayon"
            threads: 2
            mpi: true
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install MPI toolchain
        if: contains(matrix.feature_set.features, 'mpi')
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libopenmpi-dev openmpi-bin

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          set -euo pipefail
          FEATURES="${{ matrix.feature_set.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --all-targets --no-default-features --features "$FEATURES"
          else
            cargo build --all-targets --no-default-features
          fi

      - name: Clippy
        run: |
          set -euo pipefail
          FEATURES="${{ matrix.feature_set.features }}"
          if [ -n "$FEATURES" ]; then
            cargo clippy --all-targets --no-default-features --features "$FEATURES"
          else
            cargo clippy --all-targets --no-default-features
          fi

      - name: rustfmt
        if: matrix.feature_set.name == 'serial-real'
        run: cargo fmt --all -- --check

      - name: Unit tests (serial)
        if: ${{ !matrix.feature_set.mpi }}
        env:
          RAYON_NUM_THREADS: ${{ matrix.feature_set.threads }}
        run: |
          set -euo pipefail
          FEATURES="${{ matrix.feature_set.features }}"
          if [ -n "$FEATURES" ]; then
            cargo test --no-default-features --features "$FEATURES"
          else
            cargo test --no-default-features
          fi

      - name: Unit tests (MPI)
        if: ${{ matrix.feature_set.mpi }}
        run: |
          set -euo pipefail
          FEATURES="${{ matrix.feature_set.features }}"
          export OMPI_MCA_btl=self,tcp
          export RAYON_NUM_THREADS=${{ matrix.feature_set.threads }}
          if [ -n "$FEATURES" ]; then
            mpirun -n 2 cargo test --no-default-features --features "$FEATURES"
          else
            mpirun -n 2 cargo test --no-default-features
          fi

      - name: CG reproducibility (serial)
        if: ${{ !matrix.feature_set.mpi }}
        env:
          RAYON_NUM_THREADS: ${{ matrix.feature_set.threads }}
        run: |
          set -euo pipefail
          FEATURES="${{ matrix.feature_set.features }}"
          if [ -n "$FEATURES" ]; then
            cargo test --no-default-features --features "$FEATURES" --test cg_repro
          else
            cargo test --no-default-features --test cg_repro
          fi

      - name: CG reproducibility (MPI)
        if: ${{ matrix.feature_set.mpi }}
        run: |
          set -euo pipefail
          FEATURES="${{ matrix.feature_set.features }}"
          export OMPI_MCA_btl=self,tcp
          export RAYON_NUM_THREADS=${{ matrix.feature_set.threads }}
          if [ -n "$FEATURES" ]; then
            mpirun -n 2 cargo test --no-default-features --features "$FEATURES" --test cg_repro
          else
            mpirun -n 2 cargo test --no-default-features --test cg_repro
          fi
