name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded PR runs to save time
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minimal, faster apt set (no Python unless you actually need it)
      - name: Install build deps (no MPI)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl clang \
            libopenblas-dev liblapack-dev
          # Optional: quiet dpkg logs to speed log I/O
          sudo rm -rf /var/lib/apt/lists/*

      # Use maintained Rust toolchain action
      - name: Set up Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy,rustfmt

      # Smarter cache for target/, registry, git (handles feature/toolchain keys automatically)
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}

      # Build once per toolchain; tests on both; clippy/fmt only on stable to avoid duplication
      - name: Build (locked)
        run: cargo build --locked --verbose

      - name: Run unit tests (non-MPI)
        run: cargo test --all --locked --verbose -- --nocapture --skip mpi

      - name: Clippy (stable only)
        if: matrix.rust == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: rustfmt check (stable only)
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      # Doctests + docs on stable only; these are heavy
      - name: Doc tests (stable only)
        if: matrix.rust == 'stable'
        run: cargo test --doc --all-features --locked

      - name: Build docs (stable only; docs.rs config)
        if: matrix.rust == 'stable'
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: cargo doc --all-features --no-deps --locked

  mpi-tests:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MPI deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl clang gfortran \
            libclang-dev llvm-dev \
            libopenmpi-dev openmpi-bin openmpi-common \
            libopenblas-dev liblapack-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Verify MPI toolchain (debugging aid)
        run: |
          set -x
          which mpicc || true
          mpicc -show || true
          # Show where *.pc files actually are:
          dpkg -L libopenmpi-dev | grep '\.pc$' || true
          # Show pkg-config default search path:
          pkg-config --variable pc_path pkg-config || true

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build (all features)
        env:
          # Tell pkg-config where OpenMPI’s ompi.pc is (plus standard dirs)
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/openmpi/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig
          # Prefer compiler wrapper as an additional discovery route
          MPICC: mpicc
          # Hint which pkg-config package to use if the build script supports it
          MPI_PKG_CONFIG: ompi
        run: |
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          pkg-config --modversion ompi
          pkg-config --cflags --libs ompi
          cargo build --all-features --locked --verbose

      # Add oversubscription + force TCP/self transports to avoid IB/UCX hiccups on GH runners
      - name: Run MPI tests (4 processes)
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          OMPI_MCA_btl: self,tcp
          OMPI_MCA_plm: rsh
        run: |
          echo "[CI] Running MPI-enabled tests with 4 processes..."
          mpirun --oversubscribe -np 4 \
            cargo test --all-features --locked -- --nocapture --ignored
