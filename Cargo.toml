[package]
name = "kryst"
version = "4.0.3"
edition = "2024"
authors = ["Thomas James Mathis <tmathis720@gmail.com>"]
description = "Krylov subspace and preconditioned iterative solvers for dense and sparse linear systems, with shared and distributed memory parallelism."
license = "MIT"
repository = "https://github.com/tmathis720/kryst"
documentation = "https://docs.rs/kryst"
homepage = "https://github.com/tmathis720/kryst"
readme = "README.md"
categories = ["science", "mathematics", "algorithms"]
keywords = ["krylov", "gmres", "linear-solver", "parallel", "mpi"]
exclude = [
    "examples/*/e*.mtx",
    "references/*.pdf",
    "target/*",
    ".git/*",
    "*.png",
    "*.jpg",
    "*.jpeg",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
doctest = true

[dependencies]
rand = "0.10"
num-traits = "0.2"
thiserror = "2.0"
bitflags = { version = "2.11.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
rayon = { version = "1.11", optional = true }
mpi = { version = "0.8", optional = true }
num_cpus = { version = "1.17", optional = true }
log = "0.4"
tempfile = "3.27.0"
once_cell = "1"
smallvec = "1.15"
parking_lot = { version = "0.12", optional = true }
oorandom = "11"
wide = { version = "1.2", optional = true }
rand_distr = "0.6"
num-complex = { version = "0.4", optional = true }
faer = { version = "0.24.0", optional = true, default-features = false, features = ["std"] }
nalgebra = { version = "0.34", optional = true }
sprs = { version = "0.11", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.8", default-features = false }
env_logger = "0.11"
proptest = "1"
iai-callgrind = "0.16"
rand = "0.10"
faer = "0.24.0"

[features]
default = ["rayon", "backend-faer"]
complex = ["dep:num-complex"]
rayon = ["dep:rayon", "dep:num_cpus"]
mpi = ["dep:mpi"]
logging = []
mpi_examples = ["mpi"]
superlu_dist = ["backend-faer"]
superlu3d = []
parmetis = []
tuning = []
iai = []
invariants = []
transpose-cache = ["dep:parking_lot"]
metrics = []
amd = []
proptest = []
simd = ["dep:wide"]
x86_intrinsics = []

# Gate top-level re-exports of dense-direct solvers (LU/QR)
dense-direct = ["backend-faer"]

# Opt-in: compute a fingerprint of raw Mat<f64> values to strengthen cache invalidation.
# Off by default due to O(m*n) hashing cost on each conversion call.
mat-values-fingerprint = []

# Optional, OFF by default, so new PCs must target the modern trait.
legacy-pc-bridge = []
complex_ilu = []
backend-faer = ["dep:faer"]
backend-nalgebra = ["dep:nalgebra"]
backend-naive = []
backend-sprs = ["dep:sprs"]
nalgebra-explicit-dense = ["backend-nalgebra"]

[[example]]
name = "mpi_amg_gmres_demo"
required-features = ["mpi_examples"]
doc-scrape-examples = true

[[bench]]
name = "rap"
harness = false

[[bench]]
name = "tri_solve"
harness = false

[[bench]]
name = "submatrix"
harness = false

[[bench]]
name = "apply_no_alloc"
harness = false

[[bench]]
name = "direct_vs_faer"
harness = false

[[bench]]
name = "ksp_core"
harness = false

[[bench]]
name = "repeated_solves"
harness = false

[[bench]]
name = "gmres_variants"
harness = false

[[bench]]
name = "mpi_rayon_suite"
harness = false

[[bench]]
name = "iai"
harness = false

[[bench]]
name = "spmv"
harness = false

[[bench]]
name = "cg"
harness = false

[[bench]]
name = "pcg_pipelined_scaling"
harness = false

[[bench]]
name = "solver_reduction_scaling"
harness = false

[[bench]]
name = "preconditioner_complex_quality"
harness = false

[[bench]]
name = "fieldsplit_modes"
harness = false
[[bench]]
name = "fgmres_rayon"
harness = false

